<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1dc" />
    <meta name="description" content="Page not found on AURA." />
    <title>Page Not Found | AURA</title>
    <link rel="stylesheet" crossorigin href="./assets/app-BbiuYw5M.css">
    <style>
      .error-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .error-layout h1 {
        font-family: var(--font-serif);
        font-size: 36px;
        margin-bottom: 12px;
      }
      .error-layout p {
        color: #666666;
        margin-bottom: 32px;
      }
      .error-layout .btn {
        width: auto;
        padding: 16px 32px;
      }
    </style>
  </head>
  <body>
    <div class="error-layout">
        <h1>404</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a href="/" class="btn btn-primary">Return Home</a>
    </div>
  </body>
</html>
